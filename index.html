    <script>
let  evenCount = function(){ 
    for ( let i = 0; i <=100; i++ ) { 
        if (i%2 === 0) { 
        console.log(i)  } 
 } 
} 
evenCount()
      let  oddCount = function(){ 
    for ( let i = 100; i >=0; i-- ) { 
        if (i%2 === 1) { 
        console.log(i)  } 
 } 
} 
oddCount()
</script>
